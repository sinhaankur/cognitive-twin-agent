[package]
name = "cognitive-twin-core"
version = "0.1.0"
edition = "2021"
description = "Portable core for the Cognitive Twin — persona, memory, routing, and the agent loop. Compiles to macOS, iOS, Windows, Linux, Android, and WASM."
license = "AGPL-3.0-or-later"

[lib]
# rlib for Rust consumers; staticlib/cdylib so Swift (iOS/macOS) and C can link it.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM-only: expose the core to JavaScript in the browser. Native builds (macOS,
# iOS) don't pull these in, so the C FFI / desktop paths are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# (tests use std only)

# One profile, every device: these settings shape the .a/.dylib/.wasm shipped
# to iOS, macOS, Android, Windows, Linux, and the browser alike.
[profile.release]
opt-level = "s"      # persona/memory/routing is string work, not number crunching — size wins on phones and the web
lto = true           # whole-program optimization across serde and the core
codegen-units = 1    # let LLVM see everything at once (slower compile, smaller/faster output)
panic = "abort"      # unwinding can't cross the C FFI into Swift anyway; drops the landing pads
strip = "debuginfo"  # apps link the symbols they need; debug info stays out of shipped bundles
