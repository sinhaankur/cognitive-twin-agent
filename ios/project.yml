# xcodegen spec for the iOS Twin (Anita) app.
# Generate the Xcode project:  cd ios && xcodegen generate
# Then open Anita.xcodeproj, or build from the CLI (see build-ios.sh).
name: Anita
options:
  bundleIdPrefix: com.sinhaankur
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true

targets:
  Anita:
    type: application
    platform: iOS
    sources:
      - path: Vera/Sources
    # Link the portable Rust core (built into an xcframework).
    dependencies:
      - framework: ../core/CognitiveTwinCore.xcframework
        embed: true
    # Explicit Info.plist (generated by XcodeGen from these properties). We moved
    # off GENERATE_INFOPLIST_FILE so we can add the ATS exception, which can't be
    # expressed as a flat INFOPLIST_KEY_* build setting (it's a nested dict).
    info:
      path: Vera/Info.plist
      properties:
        # Brand rule (docs/BRAND.md): the product is Vera; Anita is the persona.
        CFBundleDisplayName: Vera
        # Permission strings (required for mic + speech on device).
        NSMicrophoneUsageDescription: "Listens to your voice so you can talk — audio stays on your device, never recorded."
        NSSpeechRecognitionUsageDescription: "Transcribes your speech on-device to understand you."
        # She reaches an Ollama you run on a machine YOU own, over your local
        # network / tailnet.
        NSLocalNetworkUsageDescription: "Connects to the model running on a machine you own on your local network or tailnet — so she can think. Nothing is sent to a third party."
        # App Transport Security: allow cleartext HTTP ONLY for local networking
        # (Ollama is http-only, reached on your tailnet). This is NOT a blanket
        # NSAllowsArbitraryLoads — public internet still requires TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Declare the private iCloud Drive container so it surfaces as a real folder
        # the app (and the Mac side) can read/write the sealed sync bundle in.
        NSUbiquitousContainers:
          iCloud.com.sinhaankur.vera:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Vera
            NSUbiquitousContainerSupportedFolderLevels: Any
        UILaunchScreen: {}
    # iCloud entitlement: a private iCloud Drive container the app reads/writes the
    # SEALED sync bundle in, scoped to the user's own Apple ID. The Mac side
    # (sync_icloud.py) uses the SAME container — iCloud~com~sinhaankur~vera — so the
    # two devices stay in step through the user's iCloud, nothing public. The bundle
    # is already encrypted before it touches iCloud (vault.export_bundle), so iCloud
    # only ever holds ciphertext.
    #
    # ⚠ FREE-TEAM NOTE: a free personal Apple team CANNOT sign the iCloud capability
    # ("Personal development teams do not support the iCloud capability"). To
    # SIDE-LOAD on a free team, strip this `entitlements:` block + the
    # NSUbiquitousContainers Info.plist key, regenerate, and build — the app installs
    # and runs fully, just without iCloud sync (the Python sync_icloud is a no-op
    # until a device grants the entitlement). With a paid Developer Program account,
    # keep this as-is and iCloud sync works on device. (See docs/ICLOUD-SYNC.md.)
    entitlements:
      path: Vera/Anita.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.sinhaankur.vera
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.sinhaankur.vera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinhaankur.anita
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Apple-Silicon Mac: build the active arch only (the xcframework sim slice
        # is arm64), so the simulator build doesn't try x86_64.
        ONLY_ACTIVE_ARCH: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The bridging header lets Swift call the Rust C ABI (ctwin_*).
        SWIFT_OBJC_BRIDGING_HEADER: Vera/Sources/Anita-Bridging-Header.h
        # Header search so the bridging header finds the xcframework's header.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - ../core/include
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
