<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vera — Inbox Triage</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #faf9f6; color: #1a1a19;
    }
    @media (prefers-color-scheme: dark) { body { background: #16161a; color: #ececec; } }
    header { padding: 14px 16px 10px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { margin: 3px 0 0; font-size: 11px; opacity: 0.6; }
    .pad { padding: 0 16px 16px; }
    button {
      width: 100%; padding: 10px 14px; border: 0; border-radius: 10px;
      background: #1a1a19; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { background: #ececec; color: #16161a; } }
    button:disabled { opacity: 0.5; cursor: default; }
    .counts { display: flex; gap: 6px; margin: 12px 0 8px; }
    .chip { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: rgba(0,0,0,0.05); }
    @media (prefers-color-scheme: dark) { .chip { background: rgba(255,255,255,0.06); } }
    .chip b { display: block; font-size: 18px; }
    .chip.good b { color: #16a34a; } .chip.marketing b { color: #d97706; }
    .chip.spam b { color: #dc2626; } .chip.unsure b { color: #6b7280; }
    .chip span { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; }
    .group { margin-top: 12px; }
    .group h2 { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.55; }
    .row { padding: 7px 9px; border-radius: 8px; background: rgba(0,0,0,0.03); margin-bottom: 4px; }
    @media (prefers-color-scheme: dark) { .row { background: rgba(255,255,255,0.04); } }
    .row .from { font-weight: 600; font-size: 12px; }
    .row .subj { font-size: 12px; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .why { font-size: 10px; opacity: 0.5; margin-top: 2px; }
    .note { font-size: 11px; opacity: 0.6; margin: 10px 0 0; }
    .err { color: #dc2626; font-size: 12px; margin-top: 10px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>Vera — Inbox Triage</h1>
    <p class="sub">Reads this logged-in tab · nothing shared · read-only</p>
  </header>
  <div class="pad">
    <button id="go">Triage this inbox</button>
    <div id="result"></div>
    <p class="note" id="foot"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
