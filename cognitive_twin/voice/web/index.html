<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vera</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #14161f 0%, #06070b 70%);
      color: #f4f5f7;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 18px; overflow: hidden; -webkit-user-select: none; user-select: none;
    }
    #wave {
      width: min(640px, 92vw); height: 180px;
      border-radius: 18px;
    }
    #status {
      font-size: 13px; letter-spacing: .04em; color: #aab1c4; min-height: 20px;
      text-align: center; text-transform: lowercase;
    }
    #transcript {
      font-size: 19px; font-weight: 500; color: #fff; min-height: 26px;
      text-align: center; max-width: min(640px, 92vw); padding: 0 12px;
    }
    #answer {
      font-size: 15px; color: #d6dae6; text-align: center; line-height: 1.6;
      max-width: min(620px, 90vw); padding: 4px 14px; min-height: 24px;
      max-height: 34vh; overflow-y: auto;
    }
    .row { display: flex; gap: 12px; align-items: center; }
    button {
      appearance: none; border: 1px solid #2a2e3c; background: #11131b; color: #f4f5f7;
      font: inherit; font-size: 13px; padding: 10px 18px; border-radius: 999px;
      cursor: pointer; transition: background .2s, border-color .2s, transform .1s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    button:hover { background: #1a1d28; border-color: #3a3f52; }
    button:active { transform: translateY(1px); }
    button.primary { background: #0a84ff; border-color: #0a84ff; }
    button.primary:hover { background: #2b95ff; }
    button.listening { background: #ff453a; border-color: #ff453a; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.on { background: #30d158; }
    #foot { position: fixed; bottom: 14px; font-size: 11px; color: #5a6173; letter-spacing: .05em; }
    #foot a { color: #7a90c0; }
    .pill {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: #8a92a6; border: 1px solid #262a37; border-radius: 999px; padding: 3px 9px;
    }
    #voicePill { display: inline-flex; align-items: center; gap: 6px; }
    .vdot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #9aa6c4;
    }
    #typed { display: none; gap: 8px; align-items: center; }
    #typed input {
      background: #0e1018; border: 1px solid #2a2e3c; color: #fff; border-radius: 999px;
      padding: 9px 16px; font: inherit; font-size: 14px; width: min(420px, 70vw); outline: none;
    }
    #typed input:focus { border-color: #0a84ff; }
  </style>
</head>
<body>
  <canvas id="wave"></canvas>
  <div id="transcript"></div>
  <div id="answer"></div>
  <div id="status">tap to speak</div>

  <!-- "How she thinks" — a simple, legible pipeline (not the noisy galaxy):
       your question → what she retrieved (RAG) → how she feels → her path.
       Toggle with the 🧠 button; updates on each question. -->
  <button id="mindToggle" title="Show how she thinks (RAG + feeling)">🧠 How she thinks</button>
  <div id="mind" hidden>
    <div class="mind-step"><div class="mind-h">1 · Your question</div><div id="m-q" class="mind-body">—</div></div>
    <div class="mind-step"><div class="mind-h">2 · Searched her memory + documents <span id="m-mode" class="mind-tag"></span></div><div id="m-rag" class="mind-body">—</div></div>
    <div class="mind-step"><div class="mind-h">3 · How she feels</div><div id="m-feel" class="mind-body">—</div></div>
    <div class="mind-step"><div class="mind-h">4 · The path her thought took</div><div id="m-path" class="mind-body">—</div></div>
  </div>
  <style>
    #mindToggle {
      position: fixed; bottom: 14px; left: 18px; z-index: 50;
      font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
      border: 1px solid #2a2e3c; background: #14161d; color: #b7c0d4; cursor: pointer;
    }
    #mindToggle.on { background: #2b3350; border-color: #3a4160; color: #e9ecf2; }
    #mind {
      position: fixed; bottom: 54px; left: 18px; z-index: 50; width: min(380px, 90vw);
      max-height: 60vh; overflow-y: auto; background: #10121a; border: 1px solid #262a36;
      border-radius: 14px; padding: 12px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
    }
    .mind-step { padding: 8px 0; border-top: 1px solid #1e2230; }
    .mind-step:first-child { border-top: 0; }
    .mind-h { font-size: 11px; font-weight: 700; color: #7f88a0; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
    .mind-body { font-size: 13px; color: #d7dcea; line-height: 1.5; }
    .mind-tag { font-weight: 500; color: #6dd48a; text-transform: none; letter-spacing: 0; }
    .mind-src { display: block; font-size: 12px; color: #9aa3b5; margin: 3px 0; }
    .mind-src b { color: #c7cfde; }
    .bar { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; color: #9aa3b5; }
    .bar .track { flex: 1; height: 6px; border-radius: 4px; background: #1e2230; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 4px; }
    .chip-path { display: inline-block; font-size: 11px; color: #c7cfde; background: #1a1d28; border: 1px solid #262a36; border-radius: 6px; padding: 2px 7px; margin: 2px 3px 0 0; }
    @media (prefers-color-scheme: light) {
      #mindToggle { background: #f2f2f4; border-color: #e3e3e6; color: #1d1d1f; }
      #mind { background: #fff; border-color: #e3e3e6; color: #1d1d1f; }
      .mind-body { color: #1d1d1f; } .mind-h { color: #86868b; } .mind-src { color: #6e6e73; } .mind-src b { color: #1d1d1f; }
      .bar { color: #6e6e73; } .bar .track { background: #ececef; } .chip-path { background: #f2f2f4; border-color: #e3e3e6; color: #1d1d1f; }
    }
  </style>
  <script>
    (function(){
      const btn = document.getElementById("mindToggle"), panel = document.getElementById("mind");
      btn.addEventListener("click", () => { panel.hidden = !panel.hidden; btn.classList.toggle("on", !panel.hidden); });
      // called by app.js after each question
      window.renderMind = function(t){
        if (!t) return;
        document.getElementById("m-q").textContent = t.q || "—";
        const r = t.retrieval || {};
        document.getElementById("m-mode").textContent = r.mode ? "· " + r.mode : "";
        const rag = document.getElementById("m-rag");
        if (r.hits && r.hits.length) {
          rag.innerHTML = r.hits.map(h =>
            `<span class="mind-src"><b>${h.index || "doc"}</b> · ${(h.source||"").split("/").pop()} · ${Math.round((h.score||0)*100)}%<br>${(h.preview||"").replace(/</g,"&lt;")}</span>`).join("");
        } else { rag.textContent = "nothing matched her documents — answering from what she knows."; }
        const f = t.feel || {};
        const val = ((f.valence ?? 0) + 1) / 2, aro = (f.arousal ?? 0);
        document.getElementById("m-feel").innerHTML =
          `<div style="margin-bottom:4px"><b>${f.label || "calm"}</b>${f.stance ? " · " + f.stance : ""}</div>` +
          bar("mood", val, "#6dd48a") + bar("stress / arousal", aro, "#ff9f6b");
        const path = t.path || [];
        document.getElementById("m-path").innerHTML = path.length
          ? path.map(p => `<span class="chip-path">${p}</span>`).join(" → ") : "—";
      };
      function bar(label, v, color){
        v = Math.max(0, Math.min(1, v));
        return `<div class="bar">${label}<div class="track"><div class="fill" style="width:${Math.round(v*100)}%;background:${color}"></div></div>${Math.round(v*100)}%</div>`;
      }
    })();
  </script>

  <!-- Visible chat: the conversation + the RAG sources that grounded each reply,
       so you can SEE what Vera retrieved. -->
  <div id="chat" aria-live="polite"></div>
  <style>
    /* Chat palette ADAPTS to the OS appearance (dark/light) — dark is the default
       (matches the orb), overridden by the light block below. */
    :root {
      --chat-you-bg: #0a84ff; --chat-you-fg: #fff;
      --chat-vera-bg: #1b1e28; --chat-vera-fg: #e9ecf2; --chat-vera-bd: #2a2e3c;
      --chat-muted: #8b93a7;
      --chip-bg: #14161d; --chip-bd: #262a36; --chip-fg: #9aa3b5; --chip-strong: #c7cfde;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --chat-you-bg: #0a84ff; --chat-you-fg: #fff;
        --chat-vera-bg: #ffffff; --chat-vera-fg: #1d1d1f; --chat-vera-bd: #e3e3e6;
        --chat-muted: #86868b;
        --chip-bg: #f2f2f4; --chip-bd: #e3e3e6; --chip-fg: #6e6e73; --chip-strong: #1d1d1f;
      }
    }
    #chat {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 150px; width: min(680px, 92vw); max-height: 48vh;
      overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding: 4px 2px; scrollbar-width: thin;
    }
    #chat:empty { display: none; }
    .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .msg.you { align-self: flex-end; background: var(--chat-you-bg); color: var(--chat-you-fg); border-bottom-right-radius: 5px; }
    .msg.vera { align-self: flex-start; background: var(--chat-vera-bg); color: var(--chat-vera-fg); border: 1px solid var(--chat-vera-bd); border-bottom-left-radius: 5px; }
    .msg.thinking { color: var(--chat-muted); font-style: italic; }
    .sources { align-self: flex-start; max-width: 82%; display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 2px 2px; }
    .src-chip { font-size: 11px; color: var(--chip-fg); background: var(--chip-bg); border: 1px solid var(--chip-bd); border-radius: 999px; padding: 2px 9px; }
    .src-chip b { color: var(--chip-strong); font-weight: 600; }
    @media (max-width: 640px) { #chat { bottom: 170px; max-height: 42vh; } .msg { max-width: 90%; } }
  </style>

  <a href="/controls" style="position:fixed;top:16px;right:18px;color:#8b93a7;text-decoration:none;font-size:13px" title="Automation control panel">⚙ Controls</a>

  <!-- KILL SWITCH: one tap halts every outward/mutating capability (net, screen
       control, email). Vera stays on-device + dormant until you release it. -->
  <button id="kill" title="Kill switch — halt all outward actions; Vera goes dormant">🛑 Kill switch</button>
  <style>
    #kill {
      position: fixed; top: 14px; left: 18px; z-index: 50;
      font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
      border: 1px solid #3a2326; background: #1a1012; color: #ff6b6b; cursor: pointer;
    }
    #kill.on { background: #ff3b30; border-color: #ff3b30; color: #fff; }
    @media (prefers-color-scheme: light) {
      #kill { background: #fff0f0; border-color: #ffd0d0; color: #d70015; }
      #kill.on { background: #d70015; border-color: #d70015; color: #fff; }
    }
  </style>
  <script>
    (function(){
      const btn = document.getElementById("kill");
      const refresh = () => fetch("/api/lockdown").then(r=>r.json()).then(s=>{
        btn.classList.toggle("on", !!s.locked);
        btn.textContent = s.locked ? "🛑 Locked down — tap to release" : "🛑 Kill switch";
      }).catch(()=>{});
      btn.addEventListener("click", async () => {
        const s = await fetch("/api/lockdown").then(r=>r.json()).catch(()=>({locked:false}));
        const next = !s.locked;
        if (next && !confirm("Engage the kill switch? Vera halts ALL outward actions (internet, screen control, email) and goes dormant until you release it.")) return;
        await fetch("/api/lockdown",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({on:next})}).catch(()=>{});
        refresh();
      });
      refresh();
    })();
  </script>

  <div class="row">
    <button id="mic" class="primary"><span class="dot" id="micdot"></span> Speak</button>
    <button id="typeToggle">Type instead</button>
    <button id="eye" title="Opt-in: she reads motion cues (calm/animated, nods) on-device. No frames are stored or sent anywhere."><span class="dot" id="eyedot"></span> See me</button>
  </div>
  <canvas id="eyeview" width="192" height="144"
    style="display:none;position:fixed;top:14px;right:14px;border-radius:12px;
           border:1px solid #2a2e3c;background:#05060a"></canvas>
  <form id="typed">
    <input id="typedInput" placeholder="Ask the twin…" autocomplete="off" />
    <button type="submit" class="primary">Ask</button>
  </form>

  <div id="foot">Vera · local-first · <span class="pill" id="modelPill">…</span> · <span class="pill" id="voicePill"><span class="vdot"></span>checking voice…</span></div>

  <script src="/siriwave.js"></script>
  <script src="/app.js"></script>
  <script src="/flow.js"></script>
  <script>
    // "See me" — the presence sense is strictly opt-in, preview always visible
    (function(){
      const btn = document.getElementById("eye"), dot = document.getElementById("eyedot");
      const view = document.getElementById("eyeview"), status = document.getElementById("status");
      btn.addEventListener("click", async () => {
        if (Presence.active){
          Presence.stop();
          view.style.display = "none"; dot.classList.remove("on");
          status.textContent = "she can no longer see you";
          return;
        }
        try{
          await Presence.start(view);
          view.style.display = "block"; dot.classList.add("on");
          status.textContent = "she can see you now — motion cues only, on-device";
        }catch(e){
          status.textContent = "camera unavailable (" + (e.name || "error") + ")";
        }
      });
    })();
  </script>
</body>
</html>
