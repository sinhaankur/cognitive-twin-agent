<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vera — Controls</title>
  <style>
    /* Native + mode-adaptive: follow the OS light/dark setting (was forced dark),
       token-driven so every surface flips cleanly, and take the accent from the
       OS itself (CSS system AccentColor) — matching the Mac app + the main chat.
       Dark is the default; the light block below overrides for light mode. */
    :root {
      color-scheme: light dark;
      --accent: #4d6ef0;          /* fallback */
      --accent: AccentColor;      /* the user's OS accent, when supported */
      --accent-fg: AccentColorText;
      --bg-0: #14161f; --bg-1: #06070b;     /* body radial gradient stops */
      --fg: #f4f5f7; --muted: #8b93a7; --muted-2: #7b839a; --muted-3: #6f7789;
      --card-bg: #12141c; --card-bd: #1e2130; --row-bd: #1a1d29;
      --sw-off: #2a2e3f; --sw-knob: #f4f5f7;
      --dot-off: #3a3f52; --dot-on: #3ddc84;
      --tag-bd: #2a2e3f; --tag-warn-fg: #f0a868; --tag-warn-bd: #4a3a24;
      --toast-bg: #1e2130; --toast-bd: #2a2e3f; --toast-err-bd: #5a2a2a; --toast-err-fg: #f0a0a0;
      --back-hover: #d6dae6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-0: #ffffff; --bg-1: #f2f2f4;
        --fg: #1d1d1f; --muted: #6e6e73; --muted-2: #86868b; --muted-3: #86868b;
        --card-bg: #ffffff; --card-bd: #e3e3e6; --row-bd: #ececef;
        --sw-off: #d1d1d6; --sw-knob: #ffffff;
        --dot-off: #c7c7cc; --dot-on: #34c759;
        --tag-bd: #e3e3e6; --tag-warn-fg: #9a6400; --tag-warn-bd: #e9d9b8;
        --toast-bg: #ffffff; --toast-bd: #e3e3e6; --toast-err-bd: #e9c0c0; --toast-err-fg: #b00020;
        --back-hover: #1d1d1f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 50% 0%, var(--bg-0) 0%, var(--bg-1) 70%);
      color: var(--fg); min-height: 100vh;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: 40px 16px 80px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; margin-bottom: 28px; }
    .group { margin-bottom: 26px; }
    .group h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted-2); margin-bottom: 10px; font-weight: 600;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--card-bd); border-radius: 14px;
      overflow: hidden;
    }
    .item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      border-top: 1px solid var(--row-bd);
    }
    .item:first-child { border-top: none; }
    .item .meta { flex: 1; min-width: 0; }
    .item .label { font-weight: 500; }
    .item .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .item.unavailable { opacity: 0.45; }
    .tag {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted-2); border: 1px solid var(--tag-bd); border-radius: 6px;
      padding: 2px 6px; margin-left: 6px; vertical-align: middle;
    }
    .tag.warn { color: var(--tag-warn-fg); border-color: var(--tag-warn-bd); }
    /* switch */
    .sw { position: relative; width: 44px; height: 26px; flex: none; }
    .sw input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer; background: var(--sw-off);
      border-radius: 26px; transition: 0.2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
      background: var(--sw-knob); border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    input:disabled + .slider { cursor: not-allowed; opacity: 0.5; }
    .ro { font-size: 12px; color: var(--muted-3); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-off); flex: none; }
    .dot.on { background: var(--dot-on); }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--toast-bg); border: 1px solid var(--toast-bd); padding: 10px 16px;
      border-radius: 10px; font-size: 13px; opacity: 0; transition: 0.25s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #toast.err { border-color: var(--toast-err-bd); color: var(--toast-err-fg); }
    a.back { color: var(--muted); text-decoration: none; font-size: 13px; }
    a.back:hover { color: var(--back-hover); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Vera</a>
    <h1 style="margin-top:14px">Controls</h1>
    <div class="sub">Every automation and data source. All on-device, sealed. Switches take effect immediately.</div>
    <div id="groups"></div>
  </div>
  <div id="toast"></div>

  <script>
    const groupsEl = document.getElementById("groups");
    const toastEl = document.getElementById("toast");

    function toast(msg, err = false) {
      toastEl.textContent = msg;
      toastEl.className = "show" + (err ? " err" : "");
      setTimeout(() => (toastEl.className = ""), 2200);
    }

    // Toggles that make outward changes get an extra confirm.
    const CONFIRM = {
      booker_confirm: "Turn ON real bookings? The booker will make actual reservations on your account.",
      booker_nightly: "Schedule the booker to run automatically every night?",
      claude_cloud: "Turn ON Claude? Turns you route to a claude/… model are sent to Anthropic. Everything else stays local, and the router never auto-picks cloud.",
    };

    async function load() {
      const r = await fetch("/api/controls").then(r => r.json()).catch(() => null);
      if (!r) { groupsEl.innerHTML = "<div class='sub'>Vera server not reachable.</div>"; return; }
      render(r.controls);
    }

    function render(controls) {
      const byGroup = {};
      for (const c of controls) (byGroup[c.group] ||= []).push(c);
      groupsEl.innerHTML = "";
      for (const [group, items] of Object.entries(byGroup)) {
        const g = document.createElement("div");
        g.className = "group";
        g.innerHTML = `<h2>${group}</h2><div class="card"></div>`;
        const card = g.querySelector(".card");
        for (const c of items) card.appendChild(itemEl(c));
        groupsEl.appendChild(g);
      }
    }

    function itemEl(c) {
      const el = document.createElement("div");
      el.className = "item" + (c.available ? "" : " unavailable");
      const control = c.readonly
        ? `<span class="dot ${c.on ? "on" : ""}"></span><span class="ro">${c.on ? "connected" : "not set"}</span>`
        : `<label class="sw"><input type="checkbox" ${c.on ? "checked" : ""} ${c.available ? "" : "disabled"} data-key="${c.key}"><span class="slider"></span></label>`;
      const warn = (c.key.startsWith("booker_") || c.key === "claude_cloud")
        ? `<span class="tag warn">outward</span>` : "";
      el.innerHTML = `
        <div class="meta">
          <div class="label">${c.label}${warn}</div>
          <div class="desc">${c.description || ""}</div>
        </div>
        ${control}`;
      const input = el.querySelector("input[type=checkbox]");
      if (input) input.addEventListener("change", () => onToggle(c, input));
      return el;
    }

    async function onToggle(c, input) {
      const on = input.checked;
      if (on && CONFIRM[c.key] && !confirm(CONFIRM[c.key])) {
        input.checked = false; return;
      }
      const r = await fetch("/api/controls/set", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: c.key, on }),
      }).then(r => r.json()).catch(() => ({ error: "network error" }));
      if (r.error) {
        input.checked = !on;
        toast(r.error, true);
      } else {
        toast(`${r.label}: ${r.on ? "on" : "off"}`);
      }
    }

    load();
  </script>
</body>
</html>
