# Vera — build + publish installers on a version tag (grab-it-and-go, like
# WatchTower). Push a tag like `v0.3.2` and this builds the macOS Vera.app → .dmg
# AND a Python source/wheel dist, then attaches them to the GitHub Release.
#
#   git tag v0.3.2 && git push origin v0.3.2
#
# Nothing here uploads user data — it only packages the app.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write          # needed to create/attach the Release

jobs:
  # ── macOS: the native menu-bar Vera.app, packaged as a double-clickable .dmg ──
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Vera.app (ad-hoc signed)
        run: |
          cd macos/Vera
          ./build-app.sh
      - name: Package the .dmg
        run: ./scripts/make-dmg.sh "/Applications/Vera.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Vera-macos-dmg
          path: dist/Vera.dmg

  # ── Python: a pip/pipx-installable dist for Linux/Windows/servers ─────────────
  pydist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: vera-pydist
          path: dist/*

  # ── attach everything to the Release ──────────────────────────────────────────
  release:
    needs: [macos, pydist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Vera-macos-dmg/Vera.dmg
            artifacts/vera-pydist/*
          generate_release_notes: true
          body: |
            **Vera — your private, on-device companion.**

            - **macOS:** download `Vera.dmg`, double-click, drag Vera into Applications. First launch: right-click → Open (one-time Gatekeeper step).
            - **Linux / Windows / server:** `pipx install ./cognitive_twin_agent-*.whl` (or `pip install`), then `vera-app`. Or `docker compose up -d`.

            Everything runs on your machine. Nothing is uploaded. You build a twin of *your* loved one — the default persona is only an example.
